name: flutter_code_query
description: >-
  Fast static navigation queries and checks for Flutter apps using go_router.
  Parses lib/ without type resolution and prints JSON for coding agents.
version: 0.1.3
repository: https://github.com/halfmoon-mind/flutter_code_query
issue_tracker: https://github.com/halfmoon-mind/flutter_code_query/issues
topics:
  - flutter
  - go-router
  - navigation
  - static-analysis
  - cli

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ">=7.6.0 <15.0.0"
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  flutter_code_query:
